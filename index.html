<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lợi Ngọc Bảo Châu</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: #f5f7f2; color: #27382e; font-family: "Segoe UI", Arial, sans-serif; line-height: 1.6; }
    main { width: 100%; max-width: 760px; padding: 48px; background: #fff; border: 1px solid #e1e8dd; border-radius: 24px; box-shadow: 0 16px 50px rgba(39,56,46,.07); }
    header { padding-bottom: 28px; border-bottom: 1px solid #e1e8dd; }
    h1 { margin: 6px 0 0; font-size: clamp(1.9rem, 5vw, 2.8rem); line-height: 1.25; letter-spacing: -.035em; overflow-wrap: anywhere; }
    .label { margin: 0; color: #63785e; font-size: .85rem; font-weight: 600; }
    .details { display: grid; gap: 16px; margin-top: 28px; }
    section { padding: 20px 24px; background: #f5f7f2; border-radius: 14px; }
    h2 { margin: 0 0 6px; color: #63785e; font-size: .9rem; font-weight: 600; }
    section p { margin: 0; font-size: 1.1rem; }
    @media (max-width: 480px) { main { padding: 28px 22px; } section { padding: 18px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">Họ và tên</p>
      <h1>Lợi Ngọc Bảo Châu</h1>
    </header>
    <div class="details">
      <section aria-labelledby="major">
        <h2 id="major">Chuyên ngành</h2>
        <p>Quan hệ công chúng (PR)</p>
      </section>
      <section aria-labelledby="skills">
        <h2 id="skills">Kỹ năng</h2>
        <p>Khéo tay</p>
      </section>
      <section aria-labelledby="goals">
        <h2 id="goals">Mục tiêu nghề nghiệp</h2>
        <p>Thợ cắm hoa</p>
      </section>
    </div>
  </main>
</body>
</html>
